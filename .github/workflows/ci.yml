name: CI & Deploy

# One pipeline for both jobs a commit has to do: prove itself, then ship.
#
# These were two workflows until the checks drifted apart. Deploy re-ran lint,
# type-check, unit tests, the build and the E2E suite on every push to main,
# while the audit, the MCP checks, the coverage floor, the research prose
# freshness check and the Lighthouse budgets lived only in CI — so main paid
# for a second build of the same tree and still shipped without meeting half
# its own gate. Now one build is produced once, the E2E suite exercises the
# exact bytes the deploy job uploads, and publishing waits on that evidence.
#
# Restricting the push trigger to main keeps each push to a PR branch running
# once, via the PR's synchronize event — no duplicate runs. `workflow_dispatch`
# is inherited from the old deploy workflow: a manual run on main republishes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes. On main that also
# cancels an in-flight deploy, which is what the deploy workflow's own `pages`
# group did: the newer commit is the one worth publishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache SvelteKit artifacts
        uses: actions/cache@v6
        with:
          path: |
            .svelte-kit
            node_modules/.cache
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sveltekit-

      # Responsive image variants are regenerated by prebuild; cache them so a
      # build only re-encodes images that actually changed (~1min saved).
      - name: Cache image variants
        uses: actions/cache@v6
        with:
          path: static/images/_r
          key: ${{ runner.os }}-img-variants-${{ hashFiles('static/images/**', '!static/images/_r/**', 'scripts/generate-image-variants.mjs') }}
          restore-keys: |
            ${{ runner.os }}-img-variants-

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Type-check MCP server
        run: npm run mcp:check

      - name: Unit tests and coverage floor (Vitest)
        run: npm run test:coverage

      - name: Reference index freshness
        run: node scripts/generate-reference-index.mjs --check

      # The list pages render a committed projection of the publications
      # dataset; a data edit has to be regenerated into it.
      - name: Publication summaries freshness
        run: node scripts/generate-publication-summaries.mjs --check

      # The CV, the talks index, the slides gallery and the timeline read a
      # committed projection of the communications dataset without abstracts.
      - name: Communication summaries freshness
        run: node scripts/generate-communication-summaries.mjs --check

      # The latin-ext and vietnamese font subsets are cut to fixed Unicode
      # blocks by scripts/subset-fonts.py; the check proves the committed files
      # and the unicode-range declarations in app.html still match the script.
      - name: Font subsets freshness
        run: |
          python -m pip install --quiet fonttools brotli
          python scripts/subset-fonts.py --check

      # The record rails and the visualisations page read committed projections
      # of the full-text analysis corpus rather than the corpus itself; a new or
      # re-run analysis has to be regenerated into them.
      - name: Analysis projections freshness
        run: node scripts/generate-analysis-summaries.mjs --check

      # The research narratives are authored in the route pages and projected
      # into a committed module, so an edit to the prose has to be regenerated.
      - name: Research prose freshness
        run: node scripts/generate-research-prose.mjs --check

      - name: Build
        run: npm run build

      # Assertions about the build OUTPUT, so they have to follow the build:
      # that no heavy library has drifted into the static import graph, and that
      # every URL the sitemap advertises actually ships as a page. Kept before
      # the upload so a build that would ship a sitemap full of 404s never
      # reaches Pages.
      - name: Build output checks (bundle budget, prerender coverage)
        run: npm run check:build

      # Builds both the developer bundle and the installable .mcpb, then drives
      # each as a real subprocess against the freshly built /api documents — so
      # a renamed field, a broken tool registration, or a bundle that does not
      # boot fails here rather than on someone's desktop.
      - name: MCP server build and smoke test
        run: npm run mcp:smoke

      - name: Upload installable MCP bundle
        uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: mcp/dist/*.mcpb
          retention-days: 30

      - name: Create .nojekyll file
        run: touch build/.nojekyll

      # sourcemap: 'hidden' still writes .map files; they only serve local
      # debugging. Stripping them before either upload keeps the Pages artifact
      # lean and means the E2E suite exercises the same bytes that ship.
      - name: Strip source maps
        run: find build -name '*.map' -o -name '*.map.gz' -o -name '*.map.br' | xargs -r rm --

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - name: Upload build for E2E job
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  # Tripwire for the hand-maintained `overrides` list in package.json. Kept as
  # its own job, and deliberately out of the deploy job's `needs`, so that a
  # freshly published CVE fails the run and stays visible without blocking an
  # urgent content deploy — the property the old two-workflow split gave it by
  # simply omitting it from the deploy path.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache SvelteKit artifacts
        uses: actions/cache@v6
        with:
          path: |
            .svelte-kit
            node_modules/.cache
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sveltekit-

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-all-browsers-v1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Also out of the deploy job's `needs`: a performance budget is a standing
  # measurement, not a release gate, and it never blocked a publish before.
  lighthouse:
    name: Lighthouse budgets (PageSpeed lab audit)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Only `serve` is needed from the tree: lighthouserc.yml hosts the build
      # with it, the way the Playwright suite does.
      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      # Mobile Lighthouse against the production build, asserted against
      # lighthouserc.yml (URLs, run count, category floors, Core Web Vitals,
      # resource budgets — the file documents each). An error-level assertion
      # fails the job; the full HTML/JSON reports land in the
      # `lighthouse-results` artifact. Nothing is uploaded anywhere public.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.yml
          uploadArtifacts: true
          artifactName: lighthouse-results

  deploy:
    name: Deploy to GitHub Pages
    # The evidence publishing waits on: the tree passed its checks, and the
    # exact artifact about to be uploaded passed the E2E suite.
    needs: [quality, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets not configured — skipping purge."
            exit 0
          fi
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail --silent --show-error
          echo "Cloudflare cache purged."
