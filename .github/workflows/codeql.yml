name: 'CodeQL Security Analysis'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'

# Cancel superseded analyses on the same ref (rapid pushes to a PR would
# otherwise stack full CodeQL runs).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Use security-extended for more comprehensive analysis
          queries: security-extended
          # Exclude test files and build outputs from analysis
          config: |
            paths-ignore:
              - 'node_modules'
              - 'build'
              - '.svelte-kit'
              - 'playwright-report'
              - 'test-results'
              - '**/*.test.ts'
              - '**/*.spec.ts'
            # The only code here that writes files is the scripts/ report
            # generators (citation watch, Wikidata audit), whose job is to
            # save what they fetched; the site itself never touches the disk.
            query-filters:
              - exclude:
                  id: js/http-to-file-access

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'
