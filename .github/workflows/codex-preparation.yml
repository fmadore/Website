name: Prepare institutional map coordinates
on:
  push:
    branches: [codex/82-174-preparation]
permissions:
  contents: read
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/research-geocoding.py
      - uses: actions/upload-artifact@v7
        with:
          name: institution-coordinate-candidates
          path: geocoding-candidates.json
          retention-days: 3
