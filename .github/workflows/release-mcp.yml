name: Release MCP bundle

# Publishes the installable `.mcpb` as a GitHub Release asset, so installing it
# means clicking a link on the Releases page rather than digging through a CI
# run's artifacts.
#
# Two ways to fire it:
#   - push a tag like `mcp-v0.1.0` (the tag names the release)
#   - Actions → Release MCP bundle → Run workflow (version read from
#     mcp/package.json; an explicit input must match it)

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match mcp/package.json)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve and validate release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/resolve-mcp-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check MCP server
        run: npm run mcp:check

      # The smoke suite drives the packed bundle against real API documents, so
      # the site has to be built first. Nothing ships that has not booted.
      - name: Build site
        run: npm run build

      - name: Build and verify the bundle
        run: npm run mcp:smoke

      # The MCP Registry entry for this release: version, download URL, and the
      # SHA-256 of the exact bundle uploaded below, which MCP clients check
      # before installing. It has to be this file's hash: the bundle is a zip
      # with build timestamps, so a rebuild hashes differently. The stamped
      # server.json is attached to the release; publishing it to the registry
      # is a manual step (mcp/README.md, "Publishing to the MCP Registry").
      - name: Stamp the MCP Registry entry
        run: node scripts/stamp-mcp-registry.mjs mcp/dist/frederickmadore-website.mcpb

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MCP server ${{ steps.meta.outputs.version }}
          files: |
            mcp/dist/frederickmadore-website.mcpb
            mcp/server.json
          fail_on_unmatched_files: true
          body: |
            MCP server over the academic record published at
            [frederickmadore.com](https://www.frederickmadore.com) — search and cite
            publications, talks, research projects, digital humanities work, and the CV.

            ## Install

            Download `frederickmadore-website.mcpb` below and double-click it. Claude Desktop
            opens an install dialog; click Install. No config file to edit, no terminal, and
            no Node install needed — the app supplies its own runtime.

            On first install Claude Desktop warns that the publisher is unverified. That is
            expected: clearing it would require a paid CA-issued code-signing certificate,
            which this project does not use.

            For other MCP clients, see [`mcp/README.md`](https://github.com/fmadore/Website/blob/main/mcp/README.md).

            `server.json` is this release's entry for the MCP Registry, carrying the
            bundle's SHA-256.

            Every tool in this bundle was exercised against real data before publishing.
