# Lighthouse CI — the PageSpeed Insights lab audit, run against the production
# build in the PR gate (.github/workflows/ci.yml, `lighthouse` job) and locally
# with `npm run check:lighthouse` after `npm run build`. One file, both places.
#
# Mobile with simulated throttling (Lighthouse's default), which is the profile
# PageSpeed Insights reports in its lab section — so a number here is the number
# the site is judged on, minus the runner's CPU.
#
# On Windows the local run reports every audit and then exits 1 on a temp-dir
# cleanup EPERM in chrome-launcher; the numbers above the error are real. CI
# runs on Linux and is unaffected.
ci:
  collect:
    # `serve` hosts the build the way GitHub Pages and the Playwright suite do
    # (/publications resolves to publications.html). LHCI's own static server
    # would 404 on every clean URL.
    startServerCommand: npx serve build --listen 4173 --no-port-switching
    startServerReadyPattern: Accepting connections
    # One page per template that carries its own weight: the nameplate home,
    # the two bibliography ledgers, a publication record, and the CV (the
    # densest DOM on the site).
    url:
      - http://localhost:4173/
      - http://localhost:4173/publications
      - http://localhost:4173/publications/religious-activism-campuses
      - http://localhost:4173/conference-activity
      - http://localhost:4173/cv
    # Three runs per page; the assertions below pick the run they trust.
    numberOfRuns: 3
    settings:
      # Chrome refuses to start as root (containers) without --no-sandbox; a
      # no-op on GitHub's runners.
      chromeFlags: --no-sandbox
  assert:
    # A matrix rather than one assertion set: every entry whose pattern matches
    # a URL applies to it, so the one metric with a page-specific budget (LCP
    # on /cv) is asserted by two mutually exclusive patterns and everything
    # else by `.*`.
    assertMatrix:
      - matchingUrlPattern: '.*'
        assertions:
          # ── Category floors — the four PageSpeed headline scores ──────────
          # Performance takes the best of the three runs: CPU time on a shared
          # runner is the one input the simulation cannot normalise, and a
          # single slow run must not fail a PR. The floor sits under the
          # current mobile scores (81 on /cv, 86–93 elsewhere, measured
          # 2026-09-11 after 5.1) so it catches a step change, not the noise.
          categories:performance: [error, { minScore: 0.8, aggregationMethod: optimistic }]
          # Accessibility scores 100 everywhere but /cv, which sits at 95 on one
          # pre-existing audit (target-size: the small links in the CV's
          # digital-humanities rows). The floor leaves room for that page.
          categories:accessibility: [error, { minScore: 0.9 }]
          categories:best-practices: [error, { minScore: 0.95 }]
          categories:seo: [error, { minScore: 0.95 }]

          # ── Core Web Vitals, lab (LCP is below, per pattern) ──────────────
          cumulative-layout-shift: [error, { maxNumericValue: 0.1 }]
          total-blocking-time: [error, { maxNumericValue: 400, aggregationMethod: optimistic }]

          # ── Resource budgets — the sensitive tripwires ────────────────────
          # A category score moves a few points when a webfont or a
          # render-blocking stylesheet lands; these fail outright. Measured on
          # the five pages above (transfer sizes, gzip): fonts 4–5 files /
          # ≤330 KB, scripts ≤192 KB, 32–41 requests. The document carries the
          # inlined app stylesheet (~12 KB compressed; `kit.inlineStyleThreshold`
          # in svelte.config.js must stay above the sheet's raw size — it
          # silently fell below it once and every page render-blocked for
          # 150 ms, which is why the stylesheet budget is 1: the only sheet
          # request left is the 1 KB error-page sheet) on top of 21–25 KB of
          # page, so ≤36 KB — except /cv, which prerenders all seventeen
          # sections since 5.1 and measures 52 KB; the document budget is set
          # for it. Raise a budget only with the regression named in the commit.
          resource-summary:font:count: [error, { maxNumericValue: 5 }]
          resource-summary:font:size: [error, { maxNumericValue: 360000 }]
          resource-summary:stylesheet:count: [error, { maxNumericValue: 1 }]
          resource-summary:script:size: [error, { maxNumericValue: 250000 }]
          resource-summary:document:size: [error, { maxNumericValue: 60000 }]
          resource-summary:total:count: [error, { maxNumericValue: 70 }]

      # LCP on every page but the CV: measured 3.5–4.1 s (best of three).
      - matchingUrlPattern: '^(?!.*/cv$).*'
        assertions:
          largest-contentful-paint:
            [error, { maxNumericValue: 4500, aggregationMethod: optimistic }]

      # The CV prerenders its whole record (seventeen sections, ~360 KB of
      # HTML, and the section components in the hydration graph) since 5.1
      # — an owner's ruling that a complete static record outranks the lab
      # number. It measures 4.68 s where it measured 4.41 s with fourteen
      # sections loading after paint; the budget holds the line at 5 s.
      - matchingUrlPattern: '/cv$'
        assertions:
          largest-contentful-paint:
            [error, { maxNumericValue: 5000, aggregationMethod: optimistic }]
