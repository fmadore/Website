<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, follow" />
		<meta name="theme-color" content="#faf7ef" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)" />
		<title>Page not found | Frédérick Madore</title>

		<!--
			Static 404 page. The site is fully prerendered (adapter-static), so
			GitHub Pages serves this file with a real HTTP 404 for any unknown URL —
			no SPA redirect, no soft-404. It is intentionally self-contained: the
			SvelteKit app never boots here, so styles are inlined and the theme is
			resolved by the same bootstrap app.html uses (stored choice first, OS
			preference second), because a reader who set the site to midnight should
			not be flashed a white page by a typo. All hrefs/assets are absolute
			because this page is served at the (arbitrary) missing path. Fonts are
			the site's self-hosted files; colours mirror src/styles/base/variables.css
			(Ink + Signal).

			This page and src/routes/+error.svelte are one page in two runtimes —
			same wordmark, eyebrow, headline, lede, chips and path echo. Edit them
			together.
		-->
		<link rel="icon" type="image/png" href="/icons/favicon.png" />

		<!-- Theme initialization — mirrors the bootstrap in src/app.html. -->
		<script>
			(function () {
				var theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch (e) {
					/* storage blocked — fall through to the OS preference */
				}
				var initial =
					theme === 'light' || theme === 'dark'
						? theme
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.classList.add(initial);
				// Both theme-color metas take the resolved ground, so a stored choice
				// that contradicts the OS wins in the address bar too. Mirrors the
				// bootstrap in src/app.html.
				var grounds = { light: '#faf7ef', dark: '#171310' };
				var metas = document.querySelectorAll('meta[name="theme-color"]');
				for (var i = 0; i < metas.length; i++) {
					metas[i].setAttribute('content', grounds[initial]);
				}
			})();
		</script>

		<style>
			@font-face {
				font-family: 'Archivo';
				font-style: normal;
				font-weight: 400 900;
				font-stretch: 100% 125%;
				font-display: swap;
				src: url(/fonts/web/archivo-normal-latin.woff2) format('woff2');
			}
			@font-face {
				font-family: 'Newsreader';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url(/fonts/web/newsreader-normal-latin.woff2) format('woff2');
			}
			@font-face {
				font-family: 'Spline Sans Mono';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url(/fonts/web/spline-sans-mono-normal-latin.woff2) format('woff2');
			}

			:root {
				color-scheme: light;
				/* Daylight: warm paper + ink + pine. Each literal is the value the
				   app resolves for the token named beside it; this file cannot
				   import them, so it restates them. */
				--bg: #faf7ef; /* --color-background */
				--ink: #191509; /* --color-primary / --color-text-emphasis */
				--muted: #5c5442; /* --color-text-soft */
				--faint: #6b634e; /* --color-text-light */
				--border: #c9c0aa; /* --color-border */
				--border-dark: #a39b86; /* --color-border-dark */
				--accent: #1e6a56; /* --color-accent */
				--code-bg: #ece4d1; /* --color-code-bg */
				--font-display: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				--font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
				--font-mono: 'Spline Sans Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
			}

			/* Midnight: the microfilm negative — warm film ground, cream type.
			   The class is what the bootstrap above sets; the media query is the
			   no-JavaScript fallback, scoped so it never fights an explicit choice. */
			:root.dark {
				color-scheme: dark;
				--bg: #171310;
				--ink: #efe7d6;
				--muted: #cbc0a6;
				--faint: #b3a88d;
				--border: #453d2f;
				--border-dark: #5a5140;
				--accent: #4fbb99;
				--code-bg: #1f1a14;
			}

			@media (prefers-color-scheme: dark) {
				:root:not(.light):not(.dark) {
					color-scheme: dark;
					--bg: #171310;
					--ink: #efe7d6;
					--muted: #cbc0a6;
					--faint: #b3a88d;
					--border: #453d2f;
					--border-dark: #5a5140;
					--accent: #4fbb99;
					--code-bg: #1f1a14;
				}
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html {
				-webkit-text-size-adjust: 100%;
			}

			body {
				font-family: var(--font-serif);
				background-color: var(--bg);
				color: var(--ink);
				min-height: 100vh;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
			}

			/* 45rem less the 1.5rem gutters = a 42rem content column: the width of
			   `.error-block` in the app. */
			main {
				width: 100%;
				max-width: 45rem;
				margin: 0 auto;
				padding: 2rem 1.5rem 4rem;
			}

			/* The masthead: whose archive this is, before what went wrong. */
			.wordmark {
				font-family: var(--font-display);
				font-variation-settings: 'wdth' 122;
				font-weight: 830;
				font-size: clamp(1.15rem, 0.95rem + 0.9vw, 1.6rem);
				letter-spacing: -0.01em;
				text-transform: uppercase;
				line-height: 1;
				margin-bottom: 0.75rem;
			}

			/* Masthead rule: hierarchy is drawn in rules, not colour.
			   4px = --rule-masthead; 0.75rem = --rule-gap, the interval every
			   ruled module on the site keeps between its rule and its content. */
			.sheet {
				border-top: 4px solid var(--ink);
				padding-top: 0.75rem;
			}

			/* The .eyebrow idiom: --font-size-2xs (11.11px at 1440),
			   --font-weight-bold, --tracking-eyebrow, --space-sm below. */
			.eyebrow {
				font-family: var(--font-mono);
				font-size: clamp(0.625rem, 0.595rem + 0.15vw, 0.6944rem);
				font-weight: 700;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--accent);
				margin: 0 0 0.75rem;
			}

			h1 {
				font-family: var(--font-display);
				font-variation-settings: 'wdth' 116;
				font-weight: 830;
				font-size: clamp(2.93rem, 2.784rem + 0.732vw, 3.296rem);
				line-height: 1;
				letter-spacing: -0.015em;
				margin-bottom: 1rem; /* --space-md */
			}

			/* --font-size-lg (21.6px at 1440) on --measure-prose, --space-lg below. */
			.lede {
				font-size: clamp(1.225rem, 1.164rem + 0.305vw, 1.35rem);
				color: var(--muted);
				max-width: 50ch;
				margin-bottom: 1.5rem;
			}

			.links {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem 0.625rem;
				list-style: none;
				margin-bottom: 1.5rem;
			}

			/* The .chip idiom: 1px border on --color-border, square corners, mono
			   caps at --font-size-2xs / --tracking-caps, --color-text-soft. */
			.links a {
				display: inline-flex;
				align-items: baseline;
				font-family: var(--font-mono);
				font-size: clamp(0.625rem, 0.595rem + 0.15vw, 0.6944rem);
				font-weight: 500;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
				text-decoration: none;
				padding: calc(0.25rem + 2px) 0.5rem;
				border: 1px solid var(--border);
			}

			.links a:hover {
				border-color: var(--border-dark);
				color: var(--ink);
			}

			/* The index the requested URL was already inside is the way out —
			   .chip--selected, a solid ink fill. */
			.links a.is-current {
				background-color: var(--ink);
				border-color: var(--ink);
				color: var(--bg);
			}

			/* The site's focus ring: --border-width-medium pine at --space-1. */
			.links a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 4px;
			}

			/* The machine voice: what was asked for, printed back. */
			/* --font-size-xs, --tracking-figures, --color-text-light. The interval
			   above it is the chip row's own --space-lg margin. */
			.diagnostic {
				font-family: var(--font-mono);
				font-size: clamp(0.75rem, 0.714rem + 0.178vw, 0.8333rem);
				letter-spacing: 0.03em;
				color: var(--faint);
				margin-top: 0;
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 0.5rem;
			}

			.diagnostic-label {
				text-transform: uppercase;
				letter-spacing: 0.12em;
				font-weight: 500;
			}

			.diagnostic code {
				font-family: var(--font-mono);
				color: var(--ink);
				background-color: var(--code-bg);
				padding: 0.125rem 0.375rem;
				overflow-wrap: anywhere;
			}

			/* --font-size-sm, --space-lg above. */
			.home-link {
				display: inline-block;
				margin-top: 1.5rem;
				font-family: var(--font-mono);
				font-size: clamp(0.875rem, 0.83rem + 0.226vw, 1rem);
				color: var(--ink);
				text-decoration: underline;
				text-decoration-color: var(--accent);
				text-underline-offset: 0.2em;
			}

			.home-link:hover,
			.home-link:focus-visible {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main>
			<p class="wordmark">Frédérick Madore</p>
			<div class="sheet">
				<p class="eyebrow">Error &middot; 404</p>
				<h1>This page couldn&rsquo;t be found.</h1>
				<p class="lede">
					This page may have moved, been renamed, or never existed. A few places to pick up the
					thread:
				</p>
				<ul class="links">
					<li><a href="/publications">Publications</a></li>
					<li><a href="/research">Research</a></li>
					<li><a href="/conference-activity" data-also="/communications">Talks &amp; events</a></li>
					<li><a href="/activities">Activities</a></li>
					<li><a href="/digital-humanities">Digital humanities</a></li>
					<li><a href="/cv">CV</a></li>
				</ul>
				<p class="diagnostic">
					<span class="diagnostic-label">Requested</span>
					<code id="requested-path"></code>
				</p>
				<!-- A non-breaking space, so this file and +error.svelte render the
				     same string: Svelte trims a trailing ordinary one. -->
				<a class="home-link" href="/"
					><span aria-hidden="true">&larr;&nbsp;</span>Back to the homepage</a
				>
			</div>
		</main>

		<script>
			// Echo the path that failed, and mark the index it was already inside.
			// textContent, never innerHTML: the path is untrusted input.
			(function () {
				var path = window.location.pathname;
				// Print what the reader asked for, not its percent-encoding
				// (/publications/émancipation, not /publications/%C3%A9mancipation);
				// a malformed sequence throws, so the raw path is the fallback.
				var shown = path;
				try {
					shown = decodeURIComponent(path);
				} catch (e) {
					/* keep the raw path */
				}
				var slot = document.getElementById('requested-path');
				if (slot) slot.textContent = shown;
				var chips = document.querySelectorAll('.links a');
				for (var i = 0; i < chips.length; i++) {
					var href = chips[i].getAttribute('href');
					// data-also: a record family whose index lives under another
					// path (/communications/* are filed under Talks & events).
					var also = chips[i].getAttribute('data-also');
					var inside = function (root) {
						return path === root || path.indexOf(root + '/') === 0;
					};
					if (inside(href) || (also && inside(also))) {
						chips[i].className += ' is-current';
						chips[i].setAttribute('aria-current', 'true');
					}
				}
			})();
		</script>
	</body>
</html>
